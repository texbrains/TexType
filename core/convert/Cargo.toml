[package]
name = "convert"
description = "The one conversion interface: every formula format to and from a TexType formula record."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
encoding_rs = "0.8"
formula-format = { path = "../formula-format" }
quick-xml = "0.41"
regex = "1"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
skrifa = "0.49"
unicode-segmentation = "1"

# MathType's picture glyph measures from Windows' own rasterizer (owner's decision 2026-11-26)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[dev-dependencies]
serde_json = "1"
